# Project metadata ------------------------------------------------------------
[project]
name = "fcc-coding-challenges"
version = "0.1.0"
description = "Personal repo containing Python solutions to the freeCodeCamp Daily Coding Challenges."
requires-python = ">=3.14"
readme = "README.md"
authors = [{ name = "Karel Planken", email = "71339309+karelplanken@users.noreply.github.com" }]
dependencies = []

# Dev dependencies --------------------------------------------------------
# codespell/complexipy/mypy ship as PyPI wheels, so they live here.
# gitleaks is a standalone Go binary — install it separately.
[dependency-groups]
dev = [
    "codespell",
    "complexipy",
    "mypy>=2.3.1",
    "pytest",
    "pytest-cov",
    "ruff",
]

# Ruff (lint + format) — ported from .dev-tools/ruff.toml --------------------
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
preview = true
select = ["ANN", "C901", "D", "DOC", "E4", "E501", "E7", "E9", "EM101", "EM102", "EM103", "F", "I", "UP"]
# D417: don't require documentation for every function parameter
ignore = ["D417"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
# Also silently disables rules that conflict with "google" (e.g. D413).
convention = "google"

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# mypy (type checking) ------------------------------------------------------
[tool.mypy]
strict = true
# Uncomment if you want file/module targeting instead of passing paths on the CLI:
# files = ["challenges"]

# Individual strict-bundle flags can be overridden below if one gets too noisy
# for a specific area, e.g.:
# disallow_untyped_defs = false

# complexipy (cognitive complexity) ----------------------------------------
[tool.complexipy]
max-complexity-allowed = 15

# codespell -----------------------------------------------------------------
[tool.codespell]
skip = "*.lock,.venv"
